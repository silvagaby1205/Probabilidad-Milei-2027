name: Actualización diaria de probabilidad

on:
  schedule:
    # 21:00 UTC = 18:00 ART, de lunes a viernes (después del cierre del mercado)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests tzdata

      - name: Calcular y guardar el dato del día (bonos)
        env:
          IOL_USER: ${{ secrets.IOL_USER }}
          IOL_PASS: ${{ secrets.IOL_PASS }}
        run: python calc/calc.py

      - name: Chequear si hay ICG nuevo (solo escribe si UTDT publicó)
        run: python calc/icg_calc.py

      - name: Traer el precio de Polymarket
        run: python calc/polymarket_calc.py

      - name: Traer el riesgo país spot (método Marull/FMyA)
        run: python calc/spot_calc.py

      - name: Commitear lo que haya cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/icg_history.json data/polymarket_history.json data/spot_history.json
          git diff --quiet --cached || git commit -m "Actualización diaria $(date +'%Y-%m-%d')"
          git push
