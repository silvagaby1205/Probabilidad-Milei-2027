name: Actualización diaria de probabilidad

on:
  schedule:
    # 21:05 UTC = 18:05 ART, de lunes a viernes (después del cierre del mercado)
    - cron: '5 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests tzdata

      - name: Calcular y guardar el dato del día (bonos)
        env:
          IOL_USER: ${{ secrets.IOL_USER }}
          IOL_PASS: ${{ secrets.IOL_PASS }}
        run: python calc/calc.py

      - name: Traer el riesgo país spot (método Marull/FMyA)
        if: always()
        run: python calc/spot_calc.py

      - name: Commitear lo que haya cambiado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/spot_history.json
          if git diff --quiet --cached; then
            echo "Sin cambios para guardar"
          else
            git commit -m "Actualización diaria $(date +'%Y-%m-%d')"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              echo "Push rechazado, reintentando ($i)..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "No se pudo hacer push después de 5 intentos"; exit 1; }
          fi
