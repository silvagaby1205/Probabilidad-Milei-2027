name: Actualización frecuente (Polymarket e ICG, cada 3 horas)

on:
  schedule:
    # Cada 3 horas, en el minuto 17 (no justo en punto, para no chocar con la corrida diaria
    # ni con el horario de mayor carga de GitHub).
    # Polymarket es un mercado en vivo; el ICG sale una vez por mes, pero la fuente puede
    # cargarlo con algunas horas o días de demora, así que se revisa seguido.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests tzdata

      - name: Traer el precio de Polymarket
        run: python calc/polymarket_calc.py

      - name: Chequear si hay ICG nuevo (solo escribe si cambió)
        if: always()
        run: python calc/icg_calc.py

      - name: Commitear lo que haya cambiado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polymarket_history.json data/icg_history.json
          if git diff --quiet --cached; then
            echo "Sin cambios para guardar"
          else
            git commit -m "Polymarket e ICG $(date -u +'%Y-%m-%d %H:%M UTC')"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              echo "Push rechazado, reintentando ($i)..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "No se pudo hacer push después de 5 intentos"; exit 1; }
          fi
