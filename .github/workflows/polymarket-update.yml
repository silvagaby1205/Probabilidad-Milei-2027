name: Actualización de Polymarket (cada 3 horas)

on:
  schedule:
    # Cada 3 horas — Polymarket es un mercado en vivo, se mueve todo el día,
    # a diferencia de los otros tres (que dependen del cierre diario o son mensuales).
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests tzdata

      - name: Traer el precio de Polymarket
        run: python calc/polymarket_calc.py

      - name: Commitear si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/polymarket_history.json
          git diff --quiet --cached || git commit -m "Polymarket $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
